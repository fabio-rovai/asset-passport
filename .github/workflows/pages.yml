name: Pages

# The page is static: both games, the border desk and every verdict ship as
# files the engine wrote at build time (site/data/verdicts.json). Only the live
# forge needs a server, and a static copy says so on the page. The browser
# tests (e2e.yml) run first, and the page is deployed only when they pass.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
